<body>
  <div id="__bundler_placeholder">Loading Clínica em Ordem – Página de vendas...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

chivo, sans-serif; font-weight: 900; font-size: clamp(38px, 5vw, 60px); line-height: 1.04; letter-spacing: -0.025em\">Seu atendimento é de especialista. Sua papelada também deveria ser.<\u002Fh1>\n<p style=\"margin: 0; font-size: 21px; line-height: 1.5; color: #0B0D0B; max-width: 560px\">Mais de 120 modelos editáveis — avaliações por especialidade, evolução, contratos, termos, atestados e controle financeiro — para abrir no Word, ajustar no Canva ou imprimir em PDF hoje mesmo.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"#oferta\" style=\"display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 0 32px; background: #0B0D0B; color: #FFFFFF; font-family: Archivo, sans-serif; font-weight: 800; font-size: 18px; text-decoration: none; border-radius: 12px\">Quero minha clínica em ordem<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; color: #0B0D0B\">Acesso imediato por e-mail · Garantia de [7] dias · Pagamento seguro<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; justify-content: center\">\n<div style=\"position: relative; width: 100%; max-width: 420px; height: 440px\">\n<div style=\"position: absolute; left: 40px; top: 30px; width: 300px; height: 380px; background: #DCE4EE; border-radius: 10px; transform: rotate(-7deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 70px; top: 16px; width: 300px; height: 390px; background: #F4F7FA; border-radius: 10px; transform: rotate(4deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 50px; top: 20px; width: 310px; height: 400px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,0.35); padding: 26px; box-sizing: border-box; color: #0B0D0B; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.08em\">FICHA DE AVALIAÇÃO<\u002Fspan><span style=\"width: 34px; height: 34px; border-radius: 8px; background: {{accent}}\"><\u002Fspan><\u002Fdiv>\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2\">Ortopedia e Traumatologia<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"font-size: 11px; font-weight: 700; width: 64px\">Paciente<\u002Fspan><span style=\"flex: 1; height: 1px; background: #9AA6B5\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"font-size: 11px; font-weight: 700; width: 64px\">Queixa<\u002Fspan><span style=\"flex: 1; height: 1px; background: #9AA6B5\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"font-size: 11px; font-weight: 700; width: 64px\">HDA<\u002Fspan><span style=\"flex: 1; height: 1px; background: #9AA6B5\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size: 11px; font-weight: 700; margin-top: 4px\">Escala de dor (EVA)<\u002Fspan>\n<div style=\"display: flex; gap: 4px\"><span style=\"flex: 1; height: 14px; background: #D9F2E3; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #ECF5C9; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #FFE9B8; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #FFD2BF; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #FFB8A8; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 7px; margin-top: 6px\">\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px; background: #0B0D0B\"><\u002Fspan><span style=\"flex: 1; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px; background: #0B0D0B\"><\u002Fspan><span style=\"flex: 1; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px\"><\u002Fspan><span style=\"width: 60%; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end\"><span style=\"font-size: 10px; color: #4A524C\">[Seu logo · CREFITO]<\u002Fspan><span style=\"width: 90px; height: 1px; background: #0B0D0B\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"position: absolute; right: 0; top: 70px; padding: 8px 14px; background: #FFFFFF; color: #0B0D0B; border-radius: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)\">.DOCX<\u002Fspan>\n<span style=\"position: absolute; left: 0; top: 230px; padding: 8px 14px; background: #0B0D0B; color: #FFFFFF; border-radius: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)\">.PDF<\u002Fspan>\n<span style=\"position: absolute; right: 16px; bottom: 10px; padding: 8px 14px; background: #FFFFFF; color: #0B0D0B; border-radius: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)\">Canva<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 2. LEAD DE IDENTIFICAÇÃO -->\n<section style=\"padding: 96px 24px\">\n<div style=\"max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px\">\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #1E7A33\">Talvez você se reconheça aqui<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Você não passou anos estudando para perder a noite formatando documento.<\u002Fh2>\n<p style=\"margin: 0\">É domingo à noite. Amanhã chega um paciente novo. Você abre o Word, procura aquela ficha que um colega mandou no grupo da faculdade, apaga o logo dele, a tabela desconfigura, falta o campo de escala de dor — e quando percebe, já foi uma hora inteira.<\u002Fp>\n<p style=\"margin: 0\">Na semana seguinte, outro paciente pede um recibo para reembolso do plano. Depois alguém pergunta se você tem contrato. Depois vem o termo de uso de imagem para postar o antes-e-depois. Cada documento é um pequeno incêndio para apagar.<\u002Fp>\n<p style=\"margin: 0; font-size: 21px; font-weight: 700; line-height: 1.45\">O problema não é falta de competência clínica. É que ninguém te entregou a parte administrativa pronta.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3. DOR E CUSTO DE NÃO AGIR -->\n<section style=\"background: #EEF5EF; padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"max-width: 720px; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Improvisar documento parece economia. Mas sai caro de três jeitos.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l2.5 2.5M9 2h6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Custa tempo<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Cada ficha refeita do zero é uma hora que não vira atendimento, estudo ou descanso. Somado ao longo do ano, é tempo de agenda jogado fora.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4 3.6-7 8-7s8 3 8 7\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Custa credibilidade<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">O paciente avalia você antes de você encostar nele. Uma ficha xerocada e torta diz \"amador\". Um documento padronizado, com sua marca, diz \"clínica séria\".<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"><\u002Fpath><path d=\"M12 9v4M12 16.5v.01\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Custa segurança<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">O registro em prontuário é dever do fisioterapeuta pelas normas do COFFITO. Sem avaliação, evolução, termo e contrato bem feitos, você fica exposto em uma fiscalização ou em um conflito com paciente.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4. MECANISMO / SOLUÇÃO -->\n<section style=\"padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 16px\">\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #1E7A33\">Apresentando o Clínica em Ordem<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Um acervo organizado pela jornada do paciente. Você só escolhe, preenche e atende.<\u002Fh2>\n<p style=\"margin: 0; color: #3A403B\">Em vez de uma pasta bagunçada com 120 arquivos, cada modelo está separado pelo momento em que você vai precisar dele — do primeiro contato à alta.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0; border-top: 4px solid #0B0D0B; padding-top: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #1E7A33\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Escolha pela etapa<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Paciente novo? Vá em \"Antes da primeira sessão\". Avaliação neurológica? Está em \"Na avaliação\". Sem caçar arquivo.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; border-top: 4px solid #0B0D0B; padding-top: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #1E7A33\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Coloque sua marca uma vez<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Logo, nome, número do CREFITO e contato. Edite no Word ou no Canva e todos os documentos ficam com a sua cara.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; border-top: 4px solid #0B0D0B; padding-top: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #1E7A33\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Imprima ou preencha na tela<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Use o PDF para imprimir direto ou preencha no tablet e no celular durante o atendimento. Baixou, é seu.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 5. PARA QUEM É / NÃO É -->\n<section style=\"background: #EEF5EF; padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.2\">É para você se…<\u002Fh2>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Atende em consultório próprio, domiciliar ou em estúdio de pilates<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Está recém-formado(a) e quer começar com tudo organizado<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Já atende há anos, mas ainda usa fichas improvisadas<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Quer passar mais profissionalismo e cobrar melhor por isso<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 28px ; color: #0B0D0B; max-width: 560px\">Mais de 120 modelos editáveis — avaliações por especialidade, evolução, contratos, termos, atestados e controle financeiro — para abrir no Word, ajustar no Canva ou imprimir em PDF hoje mesmo.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n<a href=\"#oferta\" style=\"display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 0 32px; background: #0B0D0B; color: #FFFFFF; font-family: Archivo, sans-serif; font-weight: 800; font-size: 18px; text-decoration: none; border-radius: 12px\">Quero minha clínica em ordem<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; color: #0B0D0B\">Acesso imediato por e-mail · Garantia de [7] dias · Pagamento seguro<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; justify-content: center\">\n<div style=\"position: relative; width: 100%; max-width: 420px; height: 440px\">\n<div style=\"position: absolute; left: 40px; top: 30px; width: 300px; height: 380px; background: #DCE4EE; border-radius: 10px; transform: rotate(-7deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 70px; top: 16px; width: 300px; height: 390px; background: #F4F7FA; border-radius: 10px; transform: rotate(4deg)\"><\u002Fdiv>\n<div style=\"position: absolute; left: 50px; top: 20px; width: 310px; height: 400px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,0.35); padding: 26px; box-sizing: border-box; color: #0B0D0B; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.08em\">FICHA DE AVALIAÇÃO<\u002Fspan><span style=\"width: 34px; height: 34px; border-radius: 8px; background: #32A647\"><\u002Fspan><\u002Fdiv>\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2\">Ortopedia e Traumatologia<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"font-size: 11px; font-weight: 700; width: 64px\">Paciente<\u002Fspan><span style=\"flex: 1; height: 1px; background: #9AA6B5\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"font-size: 11px; font-weight: 700; width: 64px\">Queixa<\u002Fspan><span style=\"flex: 1; height: 1px; background: #9AA6B5\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"font-size: 11px; font-weight: 700; width: 64px\">HDA<\u002Fspan><span style=\"flex: 1; height: 1px; background: #9AA6B5\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size: 11px; font-weight: 700; margin-top: 4px\">Escala de dor (EVA)<\u002Fspan>\n<div style=\"display: flex; gap: 4px\"><span style=\"flex: 1; height: 14px; background: #D9F2E3; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #ECF5C9; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #FFE9B8; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #FFD2BF; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 14px; background: #FFB8A8; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 7px; margin-top: 6px\">\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px; background: #0B0D0B\"><\u002Fspan><span style=\"flex: 1; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px\"><\u002Fspan><span style=\"flex: 1; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px; background: #0B0D0B\"><\u002Fspan><span style=\"flex: 1; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 8px; align-items: center\"><span style=\"width: 12px; height: 12px; border: 1.5px solid #0B0D0B; border-radius: 3px\"><\u002Fspan><span style=\"width: 60%; height: 6px; background: #E3E8EF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end\"><span style=\"font-size: 10px; color: #4A524C\">[Seu logo · CREFITO]<\u002Fspan><span style=\"width: 90px; height: 1px; background: #0B0D0B\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span style=\"position: absolute; right: 0; top: 70px; padding: 8px 14px; background: #FFFFFF; color: #0B0D0B; border-radius: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)\">.DOCX<\u002Fspan>\n<span style=\"position: absolute; left: 0; top: 230px; padding: 8px 14px; background: #0B0D0B; color: #FFFFFF; border-radius: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)\">.PDF<\u002Fspan>\n<span style=\"position: absolute; right: 16px; bottom: 10px; padding: 8px 14px; background: #FFFFFF; color: #0B0D0B; border-radius: 8px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.25)\">Canva<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 96px 24px\">\n<div style=\"max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px\">\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #1E7A33\">Talvez você se reconheça aqui<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Você não passou anos estudando para perder a noite formatando documento.<\u002Fh2>\n<p style=\"margin: 0\">É domingo à noite. Amanhã chega um paciente novo. Você abre o Word, procura aquela ficha que um colega mandou no grupo da faculdade, apaga o logo dele, a tabela desconfigura, falta o campo de escala de dor — e quando percebe, já foi uma hora inteira.<\u002Fp>\n<p style=\"margin: 0\">Na semana seguinte, outro paciente pede um recibo para reembolso do plano. Depois alguém pergunta se você tem contrato. Depois vem o termo de uso de imagem para postar o antes-e-depois. Cada documento é um pequeno incêndio para apagar.<\u002Fp>\n<p style=\"margin: 0; font-size: 21px; font-weight: 700; line-height: 1.45\">O problema não é falta de competência clínica. É que ninguém te entregou a parte administrativa pronta.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"background: #EEF5EF; padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"max-width: 720px; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Improvisar documento parece economia. Mas sai caro de três jeitos.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l2.5 2.5M9 2h6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Custa tempo<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Cada ficha refeita do zero é uma hora que não vira atendimento, estudo ou descanso. Somado ao longo do ano, é tempo de agenda jogado fora.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4 3.6-7 8-7s8 3 8 7\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Custa credibilidade<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">O paciente avalia você antes de você encostar nele. Uma ficha xerocada e torta diz \"amador\". Um documento padronizado, com sua marca, diz \"clínica séria\".<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"><\u002Fpath><path d=\"M12 9v4M12 16.5v.01\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Custa segurança<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">O registro em prontuário é dever do fisioterapeuta pelas normas do COFFITO. Sem avaliação, evolução, termo e contrato bem feitos, você fica exposto em uma fiscalização ou em um conflito com paciente.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 16px\">\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #1E7A33\">Apresentando o Clínica em Ordem<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Um acervo organizado pela jornada do paciente. Você só escolhe, preenche e atende.<\u002Fh2>\n<p style=\"margin: 0; color: #3A403B\">Em vez de uma pasta bagunçada com 120 arquivos, cada modelo está separado pelo momento em que você vai precisar dele — do primeiro contato à alta.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 300px; min-width: 0; border-top: 4px solid #0B0D0B; padding-top: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #1E7A33\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Escolha pela etapa<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Paciente novo? Vá em \"Antes da primeira sessão\". Avaliação neurológica? Está em \"Na avaliação\". Sem caçar arquivo.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; border-top: 4px solid #0B0D0B; padding-top: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #1E7A33\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Coloque sua marca uma vez<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Logo, nome, número do CREFITO e contato. Edite no Word ou no Canva e todos os documentos ficam com a sua cara.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; border-top: 4px solid #0B0D0B; padding-top: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #1E7A33\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Imprima ou preencha na tela<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Use o PDF para imprimir direto ou preencha no tablet e no celular durante o atendimento. Baixou, é seu.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"background: #EEF5EF; padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.2\">É para você se…<\u002Fh2>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Atende em consultório próprio, domiciliar ou em estúdio de pilates<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Está recém-formado(a) e quer começar com tudo organizado<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Já atende há anos, mas ainda usa fichas improvisadas<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7A33\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Quer passar mais profissionalismo e cobrar melhor por isso<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 40px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.2\">Não é para você se…<\u002Fh2>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B42318\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Procura um software de prontuário eletrônico com agenda e nuvem<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B42318\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Espera que o documento substitua o seu raciocínio clínico<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B42318\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><p style=\"margin: 0\">Prefere continuar montando tudo do zero, do seu jeito<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 96px 24px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"max-width: 760px; display: flex; flex-direction: column; gap: 16px\">\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #1E7A33\">O que você recebe<\u002Fp>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.12; letter-spacing: -0.02em\">Mais de 120 modelos, do primeiro contato até a alta.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 480px; min-width: 0; border: 2px solid #D3DED5; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4A524C\">Etapa 1<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 24px\">Antes da primeira sessão<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Contrato de prestação de serviços e distrato revisados por advogado · Termo de Consentimento Livre e Esclarecido · Termo de autorização de uso de imagem · Anamnese<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 480px; min-width: 0; border: 2px solid #D3DED5; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4A524C\">Etapa 2<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 24px\">Na avaliação<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Fichas ortopédica, neurológica, saúde da mulher, geriátrica, dermatofuncional, respiratória, UTI, pilates, terapia manual e dor · Questionários, escalas e instrumentos validados<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 480px; min-width: 0; border: 2px solid #D3DED5; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4A524C\">Etapa 3<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 24px\">No acompanhamento<\u002Fh3>\n<p style=\"margin: 0; color: #3A403B\">Ficha de evolução padrão e de pilates · Lista de frequência · Solicitação de exames · Encaminhamento · Laudo · Relatório de alta<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 480px; min-width: 0; border: 2px solid #D3DED5; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4A524C\">Etapa 4<\u002Fspan>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font
